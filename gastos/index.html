<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gastos - Personales</title>
  </head>
  <body>
    <main>
      <div class="g-total"></div>
      <div class="g-pendt"></div>
      <div class="reg-gasto">
        <h2 class="title">Registrar nuevo gasto</h2>
        <form action="" method="post">
          <div class="inp-cont">
            <label for="Concepto">Concepto:</label>
            <input type="text" name="concepto" id="concepto" />
          </div>
          <div class="inp-cont">
            <label for="Monto">Monto:</label>
            <input type="text" name="gasto" id="gasto" />
          </div>
          <div class="inp-cont">
            <label for="Categoria">Categoría:</label>
            <select name="Categoria" id="Categoria">
              <option disabled selected>Seleccione una categoría</option>
            </select>
          </div>
          <button>Registrar</button>
        </form>
      </div>
      <div class="table-gen">
        <table class="table-gastos">
          <thead>
            <tr>
              <th>Concepto</th>
              <th>Monto</th>
              <th>Categoría</th>
              <th>Fecha</th>
            </tr>
          </thead>
          <tbody>
            
          </tbody>
        </table>

      </div>
    </main>
  </body>
</html>
